<style>

* {
    margin: 0;
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #ede1ff;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: radial-gradient(400px circle at 70% 70%, rgb(211, 209, 255), transparent 70%), radial-gradient(300px circle at 10% 50%, rgb(236, 207, 253), transparent 70%);
    animation: bgGlowPulse 11s ease-in-out infinite alternate;
    pointer-events: none;
}

body::-webkit-scrollbar {
    width: 7px;
}
body::-webkit-scrollbar-thumb {
    background: #9a58fc;
}
body::-webkit-scrollbar-track {
    background: white;
}


#form-wrapper {
    width: 400px;
    justify-self: center;
    margin: 10% auto;
    padding: 15px;
    border-radius: 20px;
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(5px);
    font-family: google sans;
    box-shadow: rgba(149, 157, 165, 0.2) 0px 8px 24px;
}

#form-wrapper h1 {
    font-size: 2rem;
}

#form-wrapper h2 {
    font-size: 14px;
    margin-top: 10px;
    color: rgb(145, 76, 255);
}

#form-wrapper h3 {
    font-size: 13px;
    margin: 4px;
    margin-bottom: 20px;
    font-family: inter;
}

#form-wrapper h3 span {
    color:#9a58fc;
}

#form {
    margin-top: 20px;
}

#form-minors {
    display: flex;
    align-items: center;
    gap: 10px;
}

#form input {
    width: 100%;
    flex: 50%;
    box-sizing: border-box;
    padding: 10px;
    border-radius: 10px;
    font-size: 11px;
    color:#361e1c;
    font-family: var(--second-font);
    border: solid #dedede 1px;
    outline: none;
    background: transparent;
    box-shadow: rgba(149, 157, 165, 0.2) 0px 8px 24px;
}

#form textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    border-radius: 10px;
    font-size: 11px;
    color:#361e1c;
    font-family: var(--second-font);
    border: solid #dedede 1px;
    outline: none;
    background: transparent;
    resize: none;
    height: 150px;
    margin-top: 10px;
    box-shadow: rgba(149, 157, 165, 0.2) 0px 8px 24px;
}

#form button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    box-sizing: border-box;
    border-radius: 10px;
    background:#9a58fc;
    color:white;
    font-family: google sans;
    border: none;
    outline: none;
    cursor: pointer;
    transition: 0.5s;
}

#form button:hover {
    background: #e9d8fe;
    color: #9a58fc;
}

#form #response {
    font-size: 14px;
    padding: 10px;
    margin-top: 10px;
}


</style>
</head>
<body>

</html>
